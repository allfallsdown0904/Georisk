<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海外项目国别风险分析</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>海外项目国别风险分析</h1>
    <div class="topbar-actions">
      <span class="status" id="api-status">API 检查中…</span>
      <span class="status" id="health-status">连接中…</span>
      <button id="btn-api" class="button-secondary" type="button">导入 API</button>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="profile">风险画像</button>
    <button class="tab" data-tab="alert">事件预警</button>
    <button class="tab" data-tab="scenario">情景推演</button>
    <button class="tab" data-tab="advice">建议清单</button>
  </nav>
  <main>
    <section class="panel" id="panel-profile">
      <div class="controls">
        <label for="country-select">选择国家</label>
        <select id="country-select"><option value="">加载中…</option></select>
        <label for="project-type">项目类型</label>
        <input id="project-type" type="text" value="EPC工程总承包" />
        <button id="btn-profile">生成 AI 风险分析</button>
      </div>
      <div id="profile-result" class="result"></div>
    </section>
    <section class="panel hidden" id="panel-alert">
      <div class="controls">
        <label for="question-input">咨询问题</label>
        <input id="question-input" type="text" value="当前国别风险如何？请给出针对性建议" />
        <button id="btn-analyze">开始智能分析</button>
      </div>
      <div id="rag-mode" class="mode-note"></div>
      <div id="alert-result" class="result"></div>
    </section>
    <section class="panel hidden" id="panel-scenario">
      <div id="scenario-result" class="result"></div>
    </section>
    <section class="panel hidden" id="panel-advice">
      <div id="advice-result" class="result"></div>
    </section>
  </main>

  <dialog id="api-dialog" aria-labelledby="api-dialog-title">
    <form id="api-form" method="dialog">
      <div class="dialog-header">
        <div>
          <h2 id="api-dialog-title">导入 DeepSeek API</h2>
          <p>Key 将保存到本机 runtime/api_key.txt，不会在页面回显。</p>
        </div>
        <button id="btn-api-close" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <label for="api-key-input">API Key</label>
      <input id="api-key-input" type="password" autocomplete="off" placeholder="sk-..." required />
      <p id="api-message" class="form-message" aria-live="polite"></p>
      <div class="dialog-actions">
        <button id="btn-api-cancel" class="button-muted" type="button">取消</button>
        <button id="btn-api-save" type="submit">保存并启用</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
